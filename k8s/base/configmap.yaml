        {
          "id": "22222222-2222-2222-2222-222222222222",
          "username": "mod@xpo-logistics.com",
          "email": "mod@xpo-logistics.com",
          "firstName": "Moderator",
          "lastName": "User",
          "emailVerified": true,
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "moderator123",
              "temporary": false
