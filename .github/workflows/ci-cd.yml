name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DEPLOY_NAMESPACE: xpo-logistics
  CLUSTER_NAME: test-cluster

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate backend
        working-directory: backend
        run: |
          npm ci
          find src -type f -name "*.js" -print0 | xargs -0 -n 1 node --check

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate Kubernetes YAML
        run: |
          python3 -m pip install pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          required_keys = {"apiVersion", "kind", "metadata"}
          has_error = False

          for path in sorted(Path("k8s").glob("**/*.yaml")):
              with path.open() as manifest:
                  for index, document in enumerate(yaml.safe_load_all(manifest), start=1):
                      if document is None:
                          continue

                      missing = required_keys - set(document)
                      if missing:
                          print(f"{path}:{index}: missing {', '.join(sorted(missing))}")
                          has_error = True

          if has_error:
              sys.exit(1)
          PY

      - name: Prepare image names
        id: images
        run: |
          image_prefix="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          api_image="${image_prefix}/api:${GITHUB_SHA}"
          frontend_image="${image_prefix}/frontend:${GITHUB_SHA}"
          echo "api=${api_image}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend_image}" >> "$GITHUB_OUTPUT"
          echo "API_IMAGE=${api_image}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${frontend_image}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.api }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.frontend }}

      - name: Start kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}

      - name: Load images into kind
        run: |
          docker pull "${API_IMAGE}"
          docker pull "${FRONTEND_IMAGE}"
          kind load docker-image "${API_IMAGE}" --name "${CLUSTER_NAME}"
          kind load docker-image "${FRONTEND_IMAGE}" --name "${CLUSTER_NAME}"

      - name: Deploy with kubectl
        run: |
          kubectl create namespace "${DEPLOY_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply \
            -f k8s/postgres \
            -f k8s/keycloak \
            -f k8s/redis \
            -f k8s/backend \
            -f k8s/frontend \
            -f k8s/ingress/ingress.yaml
          kubectl -n "${DEPLOY_NAMESPACE}" set image deployment/api api="${API_IMAGE}"
          kubectl -n "${DEPLOY_NAMESPACE}" set image deployment/frontend frontend="${FRONTEND_IMAGE}"

      - name: Check rollout status
        run: |
          kubectl -n "${DEPLOY_NAMESPACE}" rollout status statefulset/postgres --timeout=300s
          kubectl -n "${DEPLOY_NAMESPACE}" rollout status deploy/keycloak --timeout=300s
          kubectl -n "${DEPLOY_NAMESPACE}" rollout status deploy/redis --timeout=180s
          kubectl -n "${DEPLOY_NAMESPACE}" rollout status deploy/api --timeout=180s
          kubectl -n "${DEPLOY_NAMESPACE}" rollout status deploy/frontend --timeout=180s

      - name: HTTP smoke test
        run: |
          kubectl -n "${DEPLOY_NAMESPACE}" port-forward service/api 3000:3000 &
          sleep 5
          curl --fail http://localhost:3000/health
