name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
  NAMESPACE: xpo-logistics
  CLUSTER: test-cluster
jobs:
  validate-app:
    name: Validate ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            workdir: backend
            command: npm test && npm run syntax
          - app: frontend
            workdir: frontend
            command: npm test && npm run lint && npm run build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.workdir }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.workdir }}
        run: npm ci
      - name: Run checks
        working-directory: ${{ matrix.workdir }}
        run: ${{ matrix.command }}
  validate-k8s:
    name: Validate Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifests
        run: |
          python3 -m pip install pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import sys, yaml

          required = {"apiVersion", "kind", "metadata"}
          failed = False

          for path in sorted(Path("k8s").glob("**/*.yaml")):
              for index, doc in enumerate(yaml.safe_load_all(path.read_text()), start=1):
                  if doc is None:
                      continue
                  missing = required - set(doc)
                  if missing:
                      print(f"{path}:{index}: missing {', '.join(sorted(missing))}")
                      failed = True
          sys.exit(1 if failed else 0)
          PY
  build-images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: [validate-app, validate-k8s]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frontend
            context: .
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
  deploy-kind:
    name: Deploy to kind
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.CLUSTER }}
      - name: Load images
        run: |
          API_IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}/api:${GITHUB_SHA}"
          FRONTEND_IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}/frontend:${GITHUB_SHA}"
          echo "API_IMAGE=${API_IMAGE}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> "$GITHUB_ENV"
          docker pull "$API_IMAGE"
          docker pull "$FRONTEND_IMAGE"
          kind load docker-image "$API_IMAGE" --name "$CLUSTER"
          kind load docker-image "$FRONTEND_IMAGE" --name "$CLUSTER"
      - name: Deploy manifests
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic postgres-secret --from-literal=POSTGRES_PASSWORD=apppass --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic backend-secret --from-literal=DATABASE_URL=postgres://appuser:apppass@postgres:5432/appdb --from-literal=OAUTH_CLIENT_SECRET=ci-dummy-google-client-secret --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/postgres/configmap.yaml -f k8s/postgres/pvc.yaml -f k8s/postgres/service.yaml -f k8s/postgres/statefulset.yaml -f k8s/redis -f k8s/ingress/ingress.yaml
          kubectl apply -f k8s/backend/configmap.yaml -f k8s/backend/service.yaml -f k8s/backend/hpa.yaml -f k8s/frontend/configmap.yaml -f k8s/frontend/service.yaml
          kubectl set image --local -f k8s/backend/deployment.yaml api="$API_IMAGE" -o yaml | kubectl apply -f -
          kubectl set image --local -f k8s/frontend/deployment.yaml frontend="$FRONTEND_IMAGE" -o yaml | kubectl apply -f -
      - name: Check rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status statefulset/postgres --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deploy/redis --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deploy/api --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deploy/frontend --timeout=180s
      - name: Smoke test
        run: |
          kubectl -n "$NAMESPACE" port-forward service/api 3000:3000 &
          API_PF_PID=$!
          kubectl -n "$NAMESPACE" port-forward service/frontend 8080:80 &
          FRONTEND_PF_PID=$!
          trap 'kill "$API_PF_PID" "$FRONTEND_PF_PID"' EXIT
          sleep 5
          curl --fail http://localhost:3000/health
          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/config.js
