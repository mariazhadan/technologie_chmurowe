name: CI/CD

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DEPLOY_OVERLAY: prod
  DEPLOY_NAMESPACE: xpo-logistics-prod

jobs:
  validate:
    name: Lint, Build, And Validate Manifests
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend JavaScript syntax
        working-directory: backend
        run: find src -type f -name "*.js" -print0 | xargs -0 -n 1 node --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Validate Kustomize manifests
        run: |
          kubectl kustomize k8s/base >/dev/null
          kubectl kustomize k8s/overlays/dev >/dev/null
          kubectl kustomize k8s/overlays/prod >/dev/null

  build-and-push:
    name: Build And Push Images
    runs-on: self-hosted
    needs: validate
    if: github.event_name != 'pull_request'

    outputs:
      api_image: ${{ steps.image-names.outputs.api_image }}
      frontend_image: ${{ steps.image-names.outputs.frontend_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image names
        id: image-names
        run: |
          image_prefix="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "api_image=${image_prefix}/api" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${image_prefix}/frontend" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image-names.outputs.api_image }}:${{ github.sha }}
            ${{ steps.image-names.outputs.api_image }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image-names.outputs.frontend_image }}:${{ github.sha }}
            ${{ steps.image-names.outputs.frontend_image }}:latest

  deploy:
    name: Deploy With Kustomize
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "${KUBE_CONFIG_DATA}" ]; then
            echo "::error::KUBE_CONFIG_DATA secret is required for deployment."
            exit 1
          fi

          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version --client

      - name: Configure optional GHCR pull secret
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "${GHCR_PULL_TOKEN}" ]; then
            echo "GHCR_PULL_TOKEN is not set; assuming the pushed images are public or the cluster already has pull credentials."
            exit 0
          fi

          username="${GHCR_PULL_USERNAME:-${GITHUB_ACTOR}}"

          kubectl create namespace "${DEPLOY_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "${DEPLOY_NAMESPACE}" create secret docker-registry ghcr-pull-secret \
            --docker-server="${REGISTRY}" \
            --docker-username="${username}" \
            --docker-password="${GHCR_PULL_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "${DEPLOY_NAMESPACE}" patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull-secret"}]}'

      - name: Render and apply Kustomize manifests
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p k8s/overlays/runtime
          cat > k8s/overlays/runtime/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization

          resources:
            - ../${DEPLOY_OVERLAY}

          images:
            - name: projekt-api
              newName: ${API_IMAGE}
              newTag: ${IMAGE_TAG}
            - name: projekt-frontend
              newName: ${FRONTEND_IMAGE}
              newTag: ${IMAGE_TAG}
          EOF

          kubectl kustomize k8s/overlays/runtime >/dev/null
          kubectl apply -k k8s/overlays/runtime

      - name: Check rollout status
        run: |
          kubectl -n "${DEPLOY_NAMESPACE}" rollout status deploy/api --timeout=180s
          kubectl -n "${DEPLOY_NAMESPACE}" rollout status deploy/frontend --timeout=180s
          kubectl -n "${DEPLOY_NAMESPACE}" rollout status deploy/mqtt --timeout=180s
          kubectl -n "${DEPLOY_NAMESPACE}" rollout status deploy/keycloak --timeout=300s
          kubectl -n "${DEPLOY_NAMESPACE}" rollout status statefulset/postgres --timeout=300s
