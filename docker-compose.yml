services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./.sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://appuser:apppass@db:5432/appdb
      PUBLIC_APP_URL: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost
      OAUTH_ISSUER_URL: https://accounts.google.com
      OAUTH_ALLOWED_ISSUERS: https://accounts.google.com,accounts.google.com
      OAUTH_JWKS_URL: https://www.googleapis.com/oauth2/v3/certs
      OAUTH_TOKEN_URL: https://oauth2.googleapis.com/token
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-CHANGE_ME_GOOGLE_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-CHANGE_ME_GOOGLE_CLIENT_SECRET}
      OAUTH_DEFAULT_ROLE: moderator
      OAUTH_USE_ID_TOKEN_FOR_API: "true"
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ""
        VITE_OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-CHANGE_ME_GOOGLE_CLIENT_ID}
    environment:
      PUBLIC_APP_URL: http://localhost
      VITE_API_BASE: ""
      VITE_OAUTH_AUTHORIZATION_URL: https://accounts.google.com/o/oauth2/v2/auth
      VITE_OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-CHANGE_ME_GOOGLE_CLIENT_ID}
      VITE_OAUTH_REDIRECT_URI: http://localhost/oauth/callback
      VITE_GOOGLE_REDIRECT_URI: http://localhost/oauth/callback
      VITE_OAUTH_SCOPE: openid email profile
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
